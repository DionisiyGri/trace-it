<!DOCTYPE html>
<html>
<head>
    <title>Trace-it</title>
</head>
<body>
    <h2>Trace-it Demo</h2>

    <div>
        <input id="url" type="text" placeholder="Enter URL to trace">
    </div>

    <div style="margin-top:10px;">
        # of clients: <input id="clients" type="number" min="1" max="100" value="1" placeholder="Number of clients">
    </div>

    <div style="margin-top:10px;">
        # of calls: <input id="calls" type="number" min="1" max="100" value="1" placeholder="Number of calls">
    </div>

    <div style="margin-top:10px;">
        <button onclick="trace()">Trace</button>
    </div>

    <div style="margin-top:20px;">
        Result:
        <div id="result"></div>
    </div>

    <script>
        async function trace() {
            const url = document.getElementById("url").value;
            const clients = parseInt(document.getElementById("clients").value, 10);
            const calls = parseInt(document.getElementById("calls").value, 10);

            const response = await fetch("/trace", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    url,
                    clients,
                    calls
                })
            });

            const result = await response.text();

            document.getElementById("result").innerText = result;
        }
    </script>
</body>
</html>
